<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{{ action }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; margin-bottom: 5px; color: #34495e; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; font-family: 'Tajawal'; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-family: 'Tajawal'; margin-top: 10px; }
        .btn-back { background: #95a5a6; text-decoration: none; display: block; text-align: center; padding: 10px; border-radius: 5px; color: white; margin-top: 10px; }
        
        .autocomplete-items { position: absolute; border: 1px solid #d4d4d4; border-bottom: none; border-top: none; z-index: 99; top: 100%; left: 0; right: 0; background: white; border-radius: 0 0 5px 5px; max-height: 200px; overflow-y: auto; }
        .autocomplete-items div { padding: 10px; cursor: pointer; background-color: #fff; border-bottom: 1px solid #d4d4d4; }
        .autocomplete-items div:hover { background-color: #e9e9e9; }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{ action }}</h2>
        <form method="POST">
            <div class="form-group">
                <label>الاسم الكامل:</label>
                <input type="text" name="name" value="{{ person.name if person else '' }}" required>
            </div>
            
            <div class="form-group">
                <label>الأب (ابحث بالاسم):</label>
                <!-- منطق التعبئة: إما من بيانات الشخص أثناء التعديل، أو من الرابط عند الإضافة -->
                <input type="text" id="search_father" placeholder="ابحث عن الأب..." autocomplete="off" 
                       value="{% if person and person.father_id %}{{ all_members|selectattr('id', 'equalto', person.father_id)|map(attribute='name')|first }}{% elif prefilled_father_id and prefilled_father_id != '0' %}{{ all_members|selectattr('id', 'equalto', prefilled_father_id|int)|map(attribute='name')|first }}{% endif %}">
                
                <input type="hidden" name="father_id" id="father_id" 
                       value="{% if person %}{{ person.father_id }}{% elif prefilled_father_id %}{{ prefilled_father_id }}{% else %}0{% endif %}">
                
                <div id="list_father" class="autocomplete-items"></div>
            </div>

            <div class="form-group">
                <label>تاريخ الميلاد:</label>
                <input type="date" name="birth_year" value="{{ person.birth_year if person else '' }}">
            </div>
            <div class="form-group">
                <label>تاريخ الوفاة (اتركه فارغاً إذا كان حياً):</label>
                <input type="date" name="death_year" value="{{ person.death_year if person else '' }}">
            </div>
            <div class="form-group">
                <label>الوظيفة:</label>
                <input type="text" name="job" value="{{ person.job if person else '' }}">
            </div>
            <div class="form-group">
                <label>رقم الجوال:</label>
                <input type="text" name="phone" value="{{ person.phone|string|replace('.0', '') if person and person.phone else '' }}">
            </div>
            
            <!-- حقل البريد الإلكتروني الجديد -->
            <div class="form-group">
                <label>البريد الإلكتروني:</label>
                <input type="email" name="email" value="{{ person.email if person else '' }}" placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>بلد الإقامة:</label>
                <input type="text" name="location" value="{{ person.location if person else '' }}">
            </div>
            
            <button type="submit">💾 حفظ البيانات</button>
            <a href="/" class="btn-back">إلغاء والعودة</a>
        </form>
    </div>

    <!-- كود JavaScript للبحث الفوري عن الأب -->
    <script>
        const fInput = document.getElementById('search_father');
        const fHidden = document.getElementById('father_id');
        const fList = document.getElementById('list_father');
        let fatherTimeout = null;

        fInput.addEventListener('input', function() {
            clearTimeout(fatherTimeout);
            const val = this.value;
            fHidden.value = "0"; // تصفير المعرف حتى يتم الاختيار
            fList.innerHTML = "";
            
            if (val.length < 2) return; // لا تبحث إذا كان الحرف واحداً

            fatherTimeout = setTimeout(() => {
                fetch('/api/search_people?q=' + encodeURIComponent(val))
                    .then(res => res.json())
                    .then(data => {
                        fList.innerHTML = "";
                        data.results.forEach(item => {
                            const div = document.createElement("div");
                            div.innerHTML = item.text;
                            div.addEventListener("click", function() {
                                fInput.value = item.text;
                                fHidden.value = item.id;
                                fList.innerHTML = "";
                            });
                            fList.appendChild(div);
                        });
                    })
                    .catch(err => console.log(err));
            }, 300); // تأخير 300 مللي ثانية لتسريع البحث
        });

        // إخفاء القائمة عند النقر خارجها
        document.addEventListener("click", function(e) {
            if (e.target !== fInput) fList.innerHTML = "";
        });
    </script>
</body>

</body>
</html>
