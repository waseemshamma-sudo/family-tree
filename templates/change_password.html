<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تغيير كلمة المرور</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #bdc3c7; border-radius: 8px; font-family: 'Tajawal'; box-sizing: border-box; font-size: 15px; }
        input:focus { border-color: #3498db; outline: none; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-family: 'Tajawal'; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #2980b9; }
        .error { color: #721c24; background: #f8d7da; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        .success { color: #155724; background: #d4edda; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        a { display: block; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
        a:hover { color: #2c3e50; }
@media (max-width: 768px) {
    .login-box, .box { width: 90%; padding: 20px; }
}
    </style>
</head>
<body>
    <div class="box">
        <h2>🔑 تغيير كلمة المرور</h2>
        
        {% if error %}
            <div class="error">❌ {{ error }}</div>
        {% endif %}
        
        {% if success %}
            <div class="success">{{ success }}</div>
        {% endif %}
        
        <form method="POST">
            <input type="password" name="current_password" placeholder="كلمة المرور الحالية" required>
            <input type="password" name="new_password" placeholder="كلمة المرور الجديدة" required>
            <input type="password" name="confirm_password" placeholder="تأكيد كلمة المرور الجديدة" required>
            <button type="submit">تحديث كلمة المرور</button>
        </form>
        
        <a href="/">العودة للرئيسية</a>
    </div>
</body>
</html>
