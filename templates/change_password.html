<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- إضافة وسم التجاوب مع شاشات الجوال -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغيير كلمة المرور</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; /* لحماية المربع من الالتصاق بحواف الشاشة في الجوال */
        }
        .box { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        h2 { color: #2c3e50; margin-top: 0; margin-bottom: 25px; font-size: 24px; }
        
        input { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 15px; 
            border: 1px solid #bdc3c7; 
            border-radius: 8px; 
            font-family: 'Tajawal', sans-serif; 
            font-size: 15px; 
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }
        
        button { 
            width: 100%; 
            padding: 14px; 
            background: #3498db; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Tajawal', sans-serif; 
            font-size: 16px; 
            font-weight: bold; 
            transition: background 0.3s;
            margin-top: 5px;
        }
        button:hover { background: #2980b9; }
        
        .error { 
            color: #c5221f; 
            background: #fce8e6; 
            border: 1px solid #fad2cf;
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            font-size: 14px; 
        }
        .success { 
            color: #155724; 
            background: #d4edda; 
            border: 1px solid #c3e6cb;
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            font-size: 14px; 
        }
        
        a { 
            display: inline-block; 
            margin-top: 20px; 
            color: #7f8c8d; 
            text-decoration: none; 
            font-size: 14px;
            transition: color 0.3s;
        }
        a:hover { color: #34495e; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔑 تغيير كلمة المرور</h2>
        
        {% if error %}
            <div class="error">❌ {{ error }}</div>
        {% endif %}
        
        {% if success %}
            <div class="success">✅ {{ success }}</div>
        {% endif %}
        
        <form method="POST">
            <input type="password" name="current_password" placeholder="كلمة المرور الحالية" required>
            <input type="password" name="new_password" placeholder="كلمة المرور الجديدة" required>
            <input type="password" name="confirm_password" placeholder="تأكيد كلمة المرور الجديدة" required>
            <button type="submit">تحديث كلمة المرور</button>
        </form>
        
        <a href="/">العودة للرئيسية</a>
    </div>
</body>
</html>
