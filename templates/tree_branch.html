<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشجرة الكاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* الإعدادات الأساسية */
        * { box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 850px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 25px; font-size: 14px; }
        
        /* شريط الأدوات */
        .toolbar { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .btn-tool { 
            padding: 10px 20px; border: none; border-radius: 25px; cursor: pointer; 
            font-family: 'Tajawal', sans-serif; font-weight: bold; font-size: 14px; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-expand { background: #e8f0fe; color: #1a73e8; }
        .btn-expand:hover { background: #d2e3fc; transform: translateY(-2px); }
        .btn-collapse { background: #fce8e6; color: #c5221f; }
        .btn-collapse:hover { background: #fad2cf; transform: translateY(-2px); }

        /* تصميم الشجرة */
        .tree-root { margin-bottom: 20px; }
        details { margin-bottom: 12px; transition: all 0.3s ease; }
        
        summary {
            cursor: pointer; padding: 12px 15px; background: #ecf0f1; border-radius: 8px; border: 1px solid #e0e6e8;
            font-weight: bold; color: #2c3e50; display: flex; align-items: center; flex-wrap: wrap;
            gap: 10px; transition: 0.2s; list-style: none; user-select: none;
        }
        summary::-webkit-details-marker { display: none; }
        summary:hover { background: #e5e8e8; }
        
        /* سهم التوسيع */
        summary::before { content: '▶'; font-size: 13px; transition: transform 0.3s; color: #95a5a6; display: inline-block; }
        details[open] > summary::before { transform: rotate(90deg); color: #3498db; }

        .member-link { color: #2c3e50; text-decoration: none; font-size: 16px; transition: color 0.2s; }
        .member-link:hover { color: #2980b9; text-decoration: underline; }
        
        /* الشارات (الأحياء والأموات) */
        .badge { background: #e8f0fe; color: #1a73e8; padding: 4px 10px; border-radius: 12px; font-size: 12px; margin-right: auto; font-weight: normal; }
        .badge-dead { background: #fce8e6; color: #c5221f; padding: 4px 10px; border-radius: 12px; font-size: 12px; margin-right: auto; font-weight: normal; }
        
        /* زر إضافة ابن */
        .btn-add-child { 
            background: #27ae60; color: white; padding: 5px 12px; border-radius: 6px; 
            text-decoration: none; font-size: 12px; font-weight: bold; transition: background 0.3s;
        }
        .btn-add-child:hover { background: #219150; }

        /* حاوية الفروع الداخلية */
        .children-container { 
            padding-right: 35px; border-right: 2px dashed #bdc3c7; 
            margin-right: 22px; margin-top: 10px; padding-top: 5px;
        }

        /* زر العودة */
        .btn-back-container { text-align: center; margin-top: 40px; }
        .btn-back { 
            display: inline-block; padding: 10px 25px; background: #7f8c8d; color: white; 
            text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s;
        }
        .btn-back:hover { background: #6c7a7d; transform: translateY(-2px); }

        /* ✅ تحسينات الجوال (تمت إعادة هيكلتها بالكامل) */
        @media (max-width: 768px) {
            .container { padding: 20px 15px; border-radius: 0; box-shadow: none; }
            h2 { font-size: 24px; }
            .toolbar { flex-direction: row; gap: 10px; }
            .btn-tool { flex: 1; justify-content: center; font-size: 13px; padding: 10px; }
            
            summary { padding: 10px; gap: 8px; align-items: center; }
            .member-link { font-size: 15px; }
            
            /* دفع الشارات والزر للأسفل في الجوال لترتيب أفضل */
            .badge, .badge-dead { margin-right: 0; margin-left: auto; font-size: 11px; padding: 3px 8px; }
            .btn-add-child { width: 100%; text-align: center; display: block; margin-top: 5px; padding: 8px; }
            
            .children-container { padding-right: 20px; margin-right: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌳 شجرة عائلة شما</h2>
        <p class="subtitle">اضغط على أي اسم لفتح فروعه، أو انقر على الاسم نفسه لعرض الملف الشخصي.</p>
        
        <div class="toolbar">
            <button class="btn-tool btn-expand" onclick="toggleAll(true)">⬇️ توسيع الكل</button>
            <button class="btn-tool btn-collapse" onclick="toggleAll(false)">⬆️ طي الكل</button>
        </div>
        
        <div class="tree-root">
            {% for branch in tree %}
                {% set branch_data = branch %}
                {% include 'tree_branch.html' %}
            {% endfor %}
        </div>
        
        <div class="btn-back-container">
            <a href="/" class="btn-back">العودة للرئيسية</a>
        </div>
    </div>

    <script>
        function toggleAll(open) {
            const detailsElements = document.querySelectorAll('details');
            detailsElements.forEach(el => { 
                el.open = open; 
            });
        }
    </script>
</body>
</html>
